name: GlobalScreener Phase 1.1 India validation (no R2)

on:
  push:
    branches:
      - data-pipeline-v2-2
  workflow_dispatch:
    inputs:
      target_sessions:
        description: "Number of NSE trading sessions to build"
        required: true
        default: "300"
      end_date:
        description: "Optional end date YYYY-MM-DD; blank = today"
        required: false
        default: ""
      max_minutes:
        description: "Maximum generator runtime"
        required: true
        default: "80"

permissions:
  contents: read

concurrency:
  group: gs-phase1-1-india
  cancel-in-progress: true

jobs:
  validate-india:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r generator/requirements.txt

      - name: Static checks and fixtures
        working-directory: generator
        run: |
          npm run check
          npm test

      - name: Build India dataset
        working-directory: generator
        env:
          BACKFILL_DAYS: ${{ inputs.target_sessions || '300' }}
          END_DATE: ${{ inputs.end_date || '' }}
          MAX_BUDGET_MINUTES: ${{ inputs.max_minutes || '80' }}
          NSE_SLEEP: "0.35"
        run: |
          node src/build-india.mjs
          node src/build-snapshot.mjs

      - name: Validate dataset
        working-directory: generator
        env:
          MIN_TARGET_SESSIONS: ${{ inputs.target_sessions || '300' }}
          MIN_UNIVERSE: "1000"
          MIN_MEDIAN_HISTORY: "250"
        run: node src/validate.mjs

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globalscreener-phase1-1-india-${{ github.run_id }}
          path: |
            state/IN.raw.json
            public/data/IN.json
            public/data/manifest.json
            test-output/
            data/raw/nse/ca/
            data/raw/nse/idx/
            data/raw/nse/symbolchange.csv
          if-no-files-found: warn
          retention-days: 7
