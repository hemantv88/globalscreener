name: GlobalScreener Phase 1.3 ETF validation (no R2)

on:
  push:
    branches:
      - data-pipeline-v2-2
    paths:
      - .github/workflows/run-etf-validation.trigger
  workflow_dispatch:
    inputs:
      target_sessions:
        description: "Number of ETF trading sessions to retain"
        required: true
        default: "300"
      max_minutes:
        description: "Maximum generator runtime"
        required: true
        default: "30"

permissions:
  contents: read

jobs:
  preflight-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r generator/requirements.txt
      - name: Static checks and fixtures
        working-directory: generator
        run: |
          npm run check
          npm test
      - name: Live ETF preflight
        working-directory: generator
        env:
          BACKFILL_DAYS: "60"
          MAX_BUDGET_MINUTES: "10"
          ETF_YEARS: "1"
          ETF_UNIVERSE_FILE: ../config/ETF_PREFLIGHT.txt
        run: |
          node src/build-etf.mjs
          node src/build-etf-snapshot.mjs
          MIN_TARGET_SESSIONS=60 node src/validate-etf.mjs

  validate-etf:
    needs: preflight-live
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r generator/requirements.txt
      - name: Static checks and fixtures
        working-directory: generator
        run: |
          npm run check
          npm test
      - name: Build ETF dataset
        working-directory: generator
        env:
          BACKFILL_DAYS: ${{ inputs.target_sessions || '300' }}
          MAX_BUDGET_MINUTES: ${{ inputs.max_minutes || '30' }}
          ETF_YEARS: "2"
          ETF_UNIVERSE_FILE: ../config/ETF_UNIVERSE.txt
        run: |
          node src/build-etf.mjs
          node src/build-etf-snapshot.mjs
      - name: Validate dataset
        working-directory: generator
        env:
          MIN_TARGET_SESSIONS: ${{ inputs.target_sessions || '300' }}
        run: node src/validate-etf.mjs
      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globalscreener-phase1-3-etf-${{ github.run_id }}
          path: |
            state/ETF.raw.json
            public/data/ETF.json
            public/data/manifest-ETF.json
            test-output/
            data/raw/us/
          if-no-files-found: warn
          retention-days: 7
