name: GlobalScreener pipeline CI

on:
  push:
    branches:
      - main
      - data-pipeline-v2-2
  pull_request:
    branches:
      - main
      - data-pipeline-v2-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -q -r generator/requirements.txt

      - name: Run syntax and fixture suite
        working-directory: generator
        run: |
          npm run check
          npm test
