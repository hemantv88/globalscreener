name: GlobalScreener India live parity QA

on:
  push:
    branches:
      - engine-parity-phase1
    paths:
      - .github/workflows/india-parity-live.yml
      - qa/india-parity-cli.mjs
      - generator/src/**
      - generator/data_kit/**
  workflow_dispatch:
    inputs:
      target_sessions:
        description: "NSE sessions to compare"
        required: true
        default: "300"
      max_minutes:
        description: "Maximum NSE acquisition runtime"
        required: true
        default: "80"

permissions:
  contents: read

concurrency:
  group: gs-india-live-parity
  cancel-in-progress: true

jobs:
  live-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r generator/requirements.txt
      - name: Build NSE raw comparison dataset
        working-directory: generator
        env:
          BACKFILL_DAYS: ${{ inputs.target_sessions || '5' }}
          MAX_BUDGET_MINUTES: ${{ inputs.max_minutes || '15' }}
          NSE_SLEEP: "0.35"
        run: node src/build-india.mjs
      - name: Fetch Google Sheets Data_India control
        run: |
          mkdir -p state test-output
          curl --fail --location --retry 3 --retry-delay 2 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQT391ILoECK80YpMc7MGbvLZYlXCT-8ZpNELFdbT1tE_zJV_78H308sL2Mp1HVJLG9XnWvW6uPY6XA/pub?gid=0&single=true&output=csv' -o state/Data_India.csv
      - name: Inspect ticker key overlap
        run: |
          python - <<'PY'
          import csv, json
          with open('state/Data_India.csv', newline='', encoding='utf-8-sig') as f:
              r=csv.DictReader(f)
              sheet=[str(x.get('Ticker') or x.get('ticker') or x.get('Symbol') or '').strip() for _,x in zip(range(20),r)]
          with open('state/IN.raw.json', encoding='utf-8') as f:
              raw=json.load(f)
          nse=[str(x.get('ticker') or '').strip() for x in raw.get('securities',[])[:20]]
          print('SHEET_SAMPLE=', sheet)
          print('NSE_SAMPLE=', nse)
          print('SHEET_NORMALIZED=', [x.upper().replace('.NS','') for x in sheet])
          print('NSE_NORMALIZED=', [x.upper().replace('.NS','') for x in nse])
          PY
      - name: Compare control vs NSE raw
        run: node qa/india-parity-cli.mjs state/Data_India.csv state/IN.raw.json
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globalscreener-india-parity-${{ github.run_id }}
          path: |
            test-output/india-parity-report.json
            state/IN.raw.json
            state/Data_India.csv
          retention-days: 7
